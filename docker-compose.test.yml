version: '3.9'

# Test environment configuration
# Usage: docker-compose -f docker-compose.test.yml up -d

services:
  postgres-test:
    image: postgres:15-alpine
    container_name: pixora-postgres-test
    environment:
      POSTGRES_USER: pixora_test
      POSTGRES_PASSWORD: pixora_test
      POSTGRES_DB: pixora_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data # Use tmpfs for faster tests
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pixora_test']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - pixora-test-network

  redis-test:
    image: redis:7-alpine
    container_name: pixora-redis-test
    ports:
      - '6380:6379'
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - pixora-test-network

  minio-test:
    image: minio/minio:latest
    container_name: pixora-minio-test
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9002:9000'
      - '9003:9001'
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - pixora-test-network

  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: pixora-backend-test
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      minio-test:
        condition: service_healthy
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://pixora_test:pixora_test@postgres-test:5432/pixora_test
      REDIS_HOST: redis-test
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio-test:9000
      S3_BUCKET: pixora-assets-test
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      JWT_SECRET: test-secret
      PORT: 4000
    ports:
      - '4002:4000'
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run start:dev
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4000/api/health']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pixora-test-network

  frontend-test:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: pixora-frontend-test
    depends_on:
      backend-test:
        condition: service_healthy
    environment:
      NODE_ENV: test
      NEXT_PUBLIC_API_URL: http://backend-test:4000/api
      NEXT_PUBLIC_WS_URL: ws://y-websocket-test:4001
    ports:
      - '3002:3000'
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    networks:
      - pixora-test-network

  y-websocket-test:
    build:
      context: ./y-websocket-server
      dockerfile: Dockerfile
      target: development
    container_name: pixora-y-websocket-test
    depends_on:
      redis-test:
        condition: service_healthy
    environment:
      NODE_ENV: test
      PORT: 4001
      REDIS_HOST: redis-test
      REDIS_PORT: 6379
    ports:
      - '4003:4001'
    volumes:
      - ./y-websocket-server:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - pixora-test-network

networks:
  pixora-test-network:
    driver: bridge
