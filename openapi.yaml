openapi: 3.0.3
info:
  title: Pixora API
  description: |
    API REST pour la plateforme Pixora - création d'assets marketing avec AI et whiteboard collaboratif.

    ## Authentification
    Toutes les routes protégées nécessitent un JWT Bearer token dans le header `Authorization: Bearer <token>`.

    ## Rate Limiting
    - **Authentifié**: 1000 req/min
    - **Non-authentifié**: 100 req/min

    ## Pagination
    Les listes utilisent cursor-based pagination:
    - `?limit=20` (défaut: 20, max: 100)
    - `?cursor=<cursor_string>`

    ## Versioning
    Version actuelle: v1 (prefix: `/api`)
  version: 1.0.0
  contact:
    email: api@pixora.com
  license:
    name: MIT

servers:
  - url: http://localhost:4000/api
    description: Développement local
  - url: https://staging-api.pixora.com/api
    description: Staging
  - url: https://api.pixora.com/api
    description: Production

tags:
  - name: auth
    description: Authentification et autorisation
  - name: users
    description: Gestion des utilisateurs
  - name: projects
    description: Projets et workspaces
  - name: boards
    description: Whiteboard canvas state
  - name: assets
    description: Upload et gestion des assets (images, logos, etc.)
  - name: tokens
    description: Système de tokens/crédits
  - name: billing
    description: Paiements Stripe et abonnements
  - name: collaborators
    description: Partage et permissions
  - name: agent
    description: AI Agent tool-router

security:
  - BearerAuth: []

paths:
  # ==================== AUTH ====================
  /auth/signup:
    post:
      tags: [auth]
      summary: Créer un nouveau compte
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: SecurePass123!
                firstName:
                  type: string
                  example: John
                lastName:
                  type: string
                  example: Doe
      responses:
        '201':
          description: Compte créé avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  tokens:
                    $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email déjà utilisé

  /auth/login:
    post:
      tags: [auth]
      summary: Se connecter
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  tokens:
                    $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [auth]
      summary: Rafraîchir le JWT avec refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Nouveau access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/google:
    get:
      tags: [auth]
      summary: Initier OAuth2 Google
      security: []
      responses:
        '302':
          description: Redirection vers Google OAuth

  /auth/google/callback:
    get:
      tags: [auth]
      summary: Callback OAuth2 Google
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirection vers frontend avec tokens

  /auth/logout:
    post:
      tags: [auth]
      summary: Se déconnecter (invalider refresh token)
      responses:
        '204':
          description: Déconnexion réussie

  # ==================== USERS ====================
  /users/me:
    get:
      tags: [users]
      summary: Obtenir le profil de l'utilisateur connecté
      responses:
        '200':
          description: Profil utilisateur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

    patch:
      tags: [users]
      summary: Mettre à jour le profil
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                avatar:
                  type: string
                  format: uri
      responses:
        '200':
          description: Profil mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  # ==================== PROJECTS ====================
  /projects:
    get:
      tags: [projects]
      summary: Lister les projets de l'utilisateur
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Liste des projets
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

    post:
      tags: [projects]
      summary: Créer un nouveau projet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  example: "Mon Projet Marketing"
                description:
                  type: string
                  example: "Campagne Q1 2025"
                settings:
                  type: object
                  properties:
                    brand:
                      type: object
                      properties:
                        colors:
                          type: array
                          items:
                            type: string
                          example: ["#FF5733", "#3498DB"]
                        fonts:
                          type: array
                          items:
                            type: string
                          example: ["Inter", "Playfair Display"]
      responses:
        '201':
          description: Projet créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'

  /projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [projects]
      summary: Obtenir un projet
      responses:
        '200':
          description: Détails du projet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [projects]
      summary: Mettre à jour un projet
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                settings:
                  type: object
      responses:
        '200':
          description: Projet mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'

    delete:
      tags: [projects]
      summary: Supprimer un projet
      responses:
        '204':
          description: Projet supprimé

  # ==================== BOARDS ====================
  /projects/{projectId}/board:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [boards]
      summary: Obtenir l'état du whiteboard
      responses:
        '200':
          description: État du board
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'

  /projects/{projectId}/board/save:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      tags: [boards]
      summary: Sauvegarder l'état du board (Yjs snapshot)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [snapshot, assets]
              properties:
                snapshot:
                  type: string
                  format: base64
                  description: Yjs document encodé en base64
                assets:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: IDs des assets référencés
                commitMessage:
                  type: string
                  example: "Ajout du logo et bannière"
      responses:
        '200':
          description: Board sauvegardé
          content:
            application/json:
              schema:
                type: object
                properties:
                  revisionId:
                    type: string
                    format: uuid
                  savedAt:
                    type: string
                    format: date-time

  /projects/{projectId}/board/revisions:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [boards]
      summary: Obtenir l'historique des révisions
      responses:
        '200':
          description: Liste des révisions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Revision'

  # ==================== ASSETS ====================
  /assets/upload-url:
    post:
      tags: [assets]
      summary: Obtenir une URL signée pour upload direct vers S3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, fileName, contentType]
              properties:
                projectId:
                  type: string
                  format: uuid
                fileName:
                  type: string
                  example: "logo.png"
                contentType:
                  type: string
                  example: "image/png"
                size:
                  type: integer
                  description: Taille en bytes
      responses:
        '200':
          description: URL signée générée
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadUrl:
                    type: string
                    format: uri
                    example: "https://s3.amazonaws.com/pixora-assets/..."
                  assetId:
                    type: string
                    format: uuid
                  expiresIn:
                    type: integer
                    description: Secondes avant expiration
                    example: 3600

  /assets/{id}/confirm:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      tags: [assets]
      summary: Confirmer l'upload et créer l'asset en DB
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                metadata:
                  type: object
                  properties:
                    width:
                      type: integer
                    height:
                      type: integer
                    format:
                      type: string
      responses:
        '201':
          description: Asset créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'

  /assets/generate:
    post:
      tags: [assets]
      summary: Générer un asset via AI (lance un job asynchrone)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, tool, prompt]
              properties:
                projectId:
                  type: string
                  format: uuid
                tool:
                  type: string
                  enum: [logo-generator, social-post, copywriter, mockup-generator, image-upscaler]
                prompt:
                  type: string
                  example: "Créer un logo moderne pour une startup fintech"
                options:
                  type: object
                  description: Options spécifiques au tool
      responses:
        '202':
          description: Job créé et en cours
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: string
                    format: uuid
                  estimatedTokens:
                    type: integer
                    example: 150
                  status:
                    type: string
                    enum: [pending, processing]
        '402':
          description: Tokens insuffisants
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Insufficient tokens"
                  required:
                    type: integer
                    example: 150
                  balance:
                    type: integer
                    example: 50

  /assets/jobs/{jobId}:
    parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [assets]
      summary: Vérifier le statut d'un job AI
      responses:
        '200':
          description: Statut du job
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [pending, processing, completed, failed]
                  progress:
                    type: integer
                    minimum: 0
                    maximum: 100
                  result:
                    type: object
                    nullable: true
                    properties:
                      assets:
                        type: array
                        items:
                          $ref: '#/components/schemas/Asset'
                  error:
                    type: string
                    nullable: true

  # ==================== TOKENS ====================
  /tokens/balance:
    get:
      tags: [tokens]
      summary: Obtenir le solde de tokens
      responses:
        '200':
          description: Solde actuel
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance:
                    type: integer
                    example: 500
                  updatedAt:
                    type: string
                    format: date-time

  /tokens/transactions:
    get:
      tags: [tokens]
      summary: Historique des transactions de tokens
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Liste des transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TokenTransaction'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /tokens/purchase:
    post:
      tags: [tokens]
      summary: Créer une session Stripe Checkout pour acheter des tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [packageId]
              properties:
                packageId:
                  type: string
                  enum: [starter, pro, business]
                  example: "pro"
                successUrl:
                  type: string
                  format: uri
                cancelUrl:
                  type: string
                  format: uri
      responses:
        '200':
          description: Session Stripe créée
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId:
                    type: string
                  url:
                    type: string
                    format: uri
                    description: URL de redirection vers Stripe Checkout

  # ==================== BILLING ====================
  /billing/subscriptions:
    get:
      tags: [billing]
      summary: Obtenir l'abonnement actif
      responses:
        '200':
          description: Détails de l'abonnement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'

    post:
      tags: [billing]
      summary: Créer un abonnement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId]
              properties:
                planId:
                  type: string
                  enum: [free, pro, enterprise]
      responses:
        '201':
          description: Abonnement créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'

  /billing/portal:
    post:
      tags: [billing]
      summary: Créer une session Stripe Customer Portal
      responses:
        '200':
          description: URL du portail client
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri

  /billing/webhooks/stripe:
    post:
      tags: [billing]
      summary: Webhook Stripe (appelé par Stripe)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook traité

  # ==================== COLLABORATORS ====================
  /projects/{projectId}/collaborators:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [collaborators]
      summary: Lister les collaborateurs d'un projet
      responses:
        '200':
          description: Liste des collaborateurs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Collaborator'

    post:
      tags: [collaborators]
      summary: Inviter un collaborateur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email:
                  type: string
                  format: email
                role:
                  type: string
                  enum: [viewer, editor]
      responses:
        '201':
          description: Invitation envoyée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collaborator'

  /projects/{projectId}/collaborators/{userId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    patch:
      tags: [collaborators]
      summary: Modifier le rôle d'un collaborateur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [viewer, editor]
      responses:
        '200':
          description: Rôle mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collaborator'

    delete:
      tags: [collaborators]
      summary: Retirer un collaborateur
      responses:
        '204':
          description: Collaborateur retiré

  # ==================== AGENT ====================
  /agent/plan:
    post:
      tags: [agent]
      summary: Planifier une requête AI (sélectionne le tool et estime le coût)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, prompt]
              properties:
                projectId:
                  type: string
                  format: uuid
                prompt:
                  type: string
                  example: "Je veux un logo moderne pour ma startup"
                context:
                  type: object
                  description: Contexte additionnel (brand colors, etc.)
      responses:
        '200':
          description: Plan généré
          content:
            application/json:
              schema:
                type: object
                properties:
                  tool:
                    type: string
                    example: "logo-generator"
                  estimatedTokens:
                    type: integer
                    example: 150
                  parameters:
                    type: object
                    description: Paramètres extraits du prompt
                  canAfford:
                    type: boolean
                    description: Si l'utilisateur a assez de tokens

  /webhook/ai-callback:
    post:
      tags: [agent]
      summary: Callback pour résultats AI asynchrones (appelé par AI service)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jobId, status]
              properties:
                jobId:
                  type: string
                  format: uuid
                status:
                  type: string
                  enum: [completed, failed]
                result:
                  type: object
                  nullable: true
                error:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Callback traité

# ==================== COMPONENTS ====================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    Cursor:
      name: cursor
      in: query
      schema:
        type: string

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        avatar:
          type: string
          format: uri
        role:
          type: string
          enum: [user, admin]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          example: 604800

    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        ownerId:
          type: string
          format: uuid
        settings:
          type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Board:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        snapshot:
          type: string
          format: base64
        updatedAt:
          type: string
          format: date-time

    Revision:
      type: object
      properties:
        id:
          type: string
          format: uuid
        boardId:
          type: string
          format: uuid
        commitMessage:
          type: string
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    Asset:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        type:
          type: string
          enum: [image, svg, video]
        metadata:
          type: object
          properties:
            width:
              type: integer
            height:
              type: integer
            format:
              type: string
            size:
              type: integer
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    TokenTransaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        amount:
          type: integer
        type:
          type: string
          enum: [purchase, deduction, refund, bonus]
        status:
          type: string
          enum: [pending, completed, failed]
        metadata:
          type: object
        createdAt:
          type: string
          format: date-time

    Subscription:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
          format: uuid
        planId:
          type: string
          enum: [free, pro, enterprise]
        status:
          type: string
          enum: [active, canceled, past_due]
        currentPeriodEnd:
          type: string
          format: date-time
        tokensAllowance:
          type: integer
          description: Tokens mensuels inclus

    Collaborator:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        role:
          type: string
          enum: [owner, editor, viewer]
        addedAt:
          type: string
          format: date-time

    Pagination:
      type: object
      properties:
        nextCursor:
          type: string
          nullable: true
        hasMore:
          type: boolean

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        statusCode:
          type: integer

  responses:
    BadRequest:
      description: Requête invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Bad Request"
            message: "Validation failed"
            statusCode: 400

    Unauthorized:
      description: Non authentifié
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Unauthorized"
            message: "Invalid or missing JWT token"
            statusCode: 401

    Forbidden:
      description: Accès refusé
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Forbidden"
