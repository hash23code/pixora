version: '3.9'

services:
  # ==================== DATABASE ====================
  postgres:
    image: postgres:15-alpine
    container_name: pixora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pixora
      POSTGRES_PASSWORD: pixora
      POSTGRES_DB: pixora
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pixora']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pixora-network

  # ==================== REDIS ====================
  redis:
    image: redis:7-alpine
    container_name: pixora-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pixora-network

  # ==================== MINIO (S3-compatible storage) ====================
  minio:
    image: minio/minio:latest
    container_name: pixora-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000' # API
      - '9001:9001' # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - pixora-network

  # Create Minio bucket on startup
  minio-createbucket:
    image: minio/mc:latest
    container_name: pixora-minio-createbucket
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/pixora-assets --ignore-existing;
      /usr/bin/mc anonymous set public myminio/pixora-assets;
      exit 0;
      "
    networks:
      - pixora-network

  # ==================== BACKEND API ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: pixora-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://pixora:pixora@postgres:5432/pixora
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: pixora-assets
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_PUBLIC_URL: http://localhost:9000/pixora-assets
      JWT_SECRET: dev-secret-change-in-prod
      PORT: 4000
    ports:
      - '4000:4000'
    volumes:
      - ./backend:/app
      - /app/node_modules
      - /app/dist
    command: npm run start:dev
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - pixora-network

  # ==================== FRONTEND ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: pixora-frontend
    restart: unless-stopped
    depends_on:
      - backend
      - y-websocket
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      NEXT_PUBLIC_WS_URL: ws://localhost:4001
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - '3000:3000'
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    networks:
      - pixora-network

  # ==================== Y-WEBSOCKET SERVER ====================
  y-websocket:
    build:
      context: ./y-websocket-server
      dockerfile: Dockerfile
      target: development
    container_name: pixora-y-websocket
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4001
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - '4001:4001'
    volumes:
      - ./y-websocket-server:/app
      - /app/node_modules
    command: npm run dev
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4001/health']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - pixora-network

  # ==================== AI SERVICE ====================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
      target: development
    container_name: pixora-ai-service
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://pixora:pixora@postgres:5432/pixora
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      STABILITY_API_KEY: ${STABILITY_API_KEY:-}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
    volumes:
      - ./ai-service:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - pixora-network

  # ==================== MONITORING (Optional for dev) ====================
